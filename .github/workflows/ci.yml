name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  cpu-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit, contract, evidence, and documentation checks
        run: make check
      - name: Validate Compose configuration without a GPU
        run: docker compose -f local/docker-compose.yml config --quiet
      - name: Build the locked sandbox without starting the model
        run: docker build -f local/Dockerfile.sandbox -t agent-quality-harness-ci .

