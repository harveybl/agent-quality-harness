services:
  model:
    image: ghcr.io/ggml-org/llama.cpp@sha256:b5e13ddfaa3df76d239ee038075960a46f595201808728fd70bbf2c8b38f6530
    command:
      - --model
      - /models/${MODEL_FILE:-Qwen3.8-27B-Q8_0.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - "65536"
      - --n-gpu-layers
      - "999"
      - --parallel
      - "1"
      - --jinja
    ports:
      - "127.0.0.1:${MODEL_PORT:-8080}:8080"
    volumes:
      - ${MODEL_DIR:-./models}:/models:ro
    gpus: all
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      - harness_net

  harness:
    build:
      context: ..
      dockerfile: local/Dockerfile.sandbox
    user: "65532:65532"
    command:
      - /workspace
      - --endpoint
      - http://model:8080/v1
      - --model
      - ${MODEL_ALIAS:-qwen-local}
    depends_on:
      - model
    volumes:
      - ${WORKSPACE_DIR:-../examples/hello-fix}:/workspace:rw
    read_only: true
    tmpfs:
      - /tmp:size=512m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    networks:
      - harness_net

networks:
  harness_net:
    internal: true

